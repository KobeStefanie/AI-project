<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="复盘">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>交易复盘（手机）</title>
<!-- 离线也要能打开：不用 CDN，样式全部内联 -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #1e293b; font-size: 16px; }
  header { position: sticky; top: 0; z-index: 5; background: #0f172a; color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #sync-badge { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #334155; }
  #sync-badge.ok { background: #166534; } #sync-badge.wait { background: #a16207; } #sync-badge.err { background: #b91c1c; }
  main { padding: 12px 12px calc(env(safe-area-inset-bottom) + 80px); }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #e2e8f0; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; border: 0; background: none; padding: 12px 0; font-size: 15px; color: #64748b; }
  nav button.on { color: #2563eb; font-weight: 600; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 14px; color: #475569; margin: 10px 0 4px; }
  textarea, input, select { width: 100%; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; background: #fff; font-family: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .btn { display: block; width: 100%; border: 0; border-radius: 8px; padding: 12px; font-size: 16px; background: #2563eb; color: #fff; margin-top: 12px; }
  .btn.gray { background: #475569; } .btn.red { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
  .muted { color: #64748b; font-size: 13px; line-height: 1.6; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 8px 0; }
  .chk input { width: 22px; height: 22px; flex: none; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: #e2e8f0; margin-left: 4px; }
  .tag.wait { background: #fef3c7; color: #92400e; } .tag.ok { background: #dcfce7; color: #166534; } .tag.no { background: #fee2e2; color: #991b1b; }
  .up { color: #dc2626; } .down { color: #16a34a; }
  .ai { background: #eff6ff; border-radius: 8px; padding: 10px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; z-index: 9; max-width: 90%; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>交易复盘</h1>
  <span id="sync-badge" role="status">未同步</span>
</header>
<main id="main" aria-live="polite"></main>
<nav aria-label="页面">
  <button data-tab="journal" class="on">复盘</button>
  <button data-tab="trades">成交</button>
  <button data-tab="watch">候选池</button>
  <button data-tab="setup">同步</button>
</nav>
<div id="toast" role="status"></div>
<script src="/m.js"></script>
</body>
</html>
