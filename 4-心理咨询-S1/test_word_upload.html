<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word上传测试</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            border: 2px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .form-field {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        input {
            padding: 5px 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        #console {
            background: #f4f4f4;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-line {
            margin: 2px 0;
            padding: 2px 5px;
        }
        .log-info { color: #0066cc; }
        .log-success { color: #008800; }
        .log-error { color: #cc0000; }
    </style>
</head>
<body>
    <h1>Word文档上传测试</h1>

    <div class="test-section">
        <h2>1. 上传Word文档</h2>
        <input type="file" id="fileInput" accept=".docx" />
        <button onclick="uploadFile()">上传并解析</button>
        <div id="status"></div>
    </div>

    <div class="test-section">
        <h2>2. 解析结果</h2>
        <div class="form-field">
            <label>案例代号：</label>
            <input type="text" id="代号" readonly />
        </div>
        <div class="form-field">
            <label>性别：</label>
            <input type="text" id="性别" readonly />
        </div>
        <div class="form-field">
            <label>年龄：</label>
            <input type="text" id="年龄" readonly />
        </div>
        <div class="form-field">
            <label>职业：</label>
            <input type="text" id="职业" readonly />
        </div>
        <div class="form-field">
            <label>婚姻状况：</label>
            <input type="text" id="婚姻状况" readonly />
        </div>
        <div class="form-field">
            <label>主诉：</label>
            <input type="text" id="主诉" readonly style="width: 500px;" />
        </div>
    </div>

    <div class="test-section">
        <h2>3. 调试日志</h2>
        <button onclick="clearConsole()">清除日志</button>
        <div id="console"></div>
    </div>

    <script>
        const CONFIG_API = 'http://localhost:8003';

        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;

            // 同时输出到浏览器控制台
            console[type === 'error' ? 'error' : 'log'](message);
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                showStatus('请选择文件', 'error');
                log('错误：未选择文件', 'error');
                return;
            }

            log('开始上传文件: ' + file.name, 'info');
            showStatus('正在上传和解析...', 'info');

            try {
                const formData = new FormData();
                formData.append('file', file);

                log('发送请求到: ' + CONFIG_API + '/api/word/parse', 'info');

                const response = await fetch(`${CONFIG_API}/api/word/parse`, {
                    method: 'POST',
                    body: formData
                });

                log('响应状态: ' + response.status + ' ' + response.statusText, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                log('解析成功，收到数据: ' + JSON.stringify(data, null, 2), 'success');

                // 填充表单
                fillForm(data);

                showStatus('解析成功！', 'success');

            } catch (error) {
                log('上传失败: ' + error.message, 'error');
                showStatus('上传失败: ' + error.message, 'error');
            }
        }

        function fillForm(data) {
            log('开始填充表单...', 'info');

            if (data.basic_info) {
                const fields = ['代号', '性别', '年龄', '职业', '婚姻状况'];
                fields.forEach(field => {
                    if (data.basic_info[field]) {
                        const element = document.getElementById(field);
                        if (element) {
                            element.value = data.basic_info[field];
                            log(`填充 ${field}: ${data.basic_info[field]}`, 'success');
                        } else {
                            log(`警告：找不到元素 ${field}`, 'error');
                        }
                    }
                });
            }

            if (data.主诉) {
                const element = document.getElementById('主诉');
                if (element) {
                    element.value = data.主诉;
                    log(`填充 主诉: ${data.主诉.substring(0, 30)}...`, 'success');
                }
            }

            log('表单填充完成', 'success');
        }
    </script>
</body>
</html>
