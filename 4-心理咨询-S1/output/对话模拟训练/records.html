<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练记录 - 对话模拟训练</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <i class="fa fa-history text-2xl"></i>
                <h1 class="text-xl font-bold">训练记录</h1>
            </div>
            <div class="flex space-x-3">
                <a href="index.html" class="bg-white text-indigo-600 px-4 py-2 rounded hover:bg-indigo-50 transition">
                    <i class="fa fa-comments mr-2"></i>新建训练
                </a>
                <a href="../index.html" class="bg-indigo-700 text-white px-4 py-2 rounded hover:bg-indigo-800 transition">
                    <i class="fa fa-home mr-2"></i>返回主页
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <!-- 统计卡片 -->
        <div class="grid md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">总训练次数</p>
                        <p id="stat-total" class="text-3xl font-bold text-indigo-600">-</p>
                    </div>
                    <i class="fa fa-list-ol text-4xl text-indigo-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">总对话轮数</p>
                        <p id="stat-turns" class="text-3xl font-bold text-green-600">-</p>
                    </div>
                    <i class="fa fa-comments-o text-4xl text-green-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">平均得分</p>
                        <p id="stat-avg-score" class="text-3xl font-bold text-yellow-600">-</p>
                    </div>
                    <i class="fa fa-star text-4xl text-yellow-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">总成本</p>
                        <p id="stat-cost" class="text-3xl font-bold text-red-600">-</p>
                    </div>
                    <i class="fa fa-dollar text-4xl text-red-200"></i>
                </div>
            </div>
        </div>

        <!-- 筛选器 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="grid md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">流派筛选</label>
                    <select id="filter-approach" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">全部流派</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">来访者筛选</label>
                    <select id="filter-visitor" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">全部来访者</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">日期筛选</label>
                    <input type="date" id="filter-date" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="w-full bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">
                        <i class="fa fa-refresh mr-2"></i>重置筛选
                    </button>
                </div>
            </div>
        </div>

        <!-- 记录表格 -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">训练日期</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">来访者/人设</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">流派</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">轮数</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">平均分</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">时长</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">成本</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody id="records-tbody" class="bg-white divide-y divide-gray-200">
                    <!-- 通过JS动态加载 -->
                </tbody>
            </table>
            <div id="no-records" class="hidden text-center py-12">
                <i class="fa fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500">暂无训练记录</p>
                <a href="index.html" class="inline-block mt-4 bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                    <i class="fa fa-plus mr-2"></i>开始第一次训练
                </a>
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];
        let filteredRecords = [];

        // 页面加载时获取数据
        window.onload = function() {
            loadRecords();
        };

        // 加载训练记录
        async function loadRecords() {
            try {
                const response = await fetch('http://localhost:8772/api/list_sessions');
                const data = await response.json();

                if (data.sessions && data.sessions.length > 0) {
                    allRecords = data.sessions;
                    filteredRecords = allRecords;

                    // 更新统计卡片
                    updateStatistics();

                    // 填充筛选器
                    populateFilters();

                    // 渲染表格
                    renderTable();
                } else {
                    showNoRecords();
                }
            } catch (error) {
                console.error('加载训练记录失败:', error);
                alert('加载训练记录失败，请确认8772服务器运行中');
            }
        }

        // 更新统计数据
        function updateStatistics() {
            const total = filteredRecords.length;
            const totalTurns = filteredRecords.reduce((sum, r) => sum + r.total_turns, 0);
            const avgScore = (filteredRecords.reduce((sum, r) => sum + r.overall_score, 0) / total).toFixed(1);
            const totalCost = filteredRecords.reduce((sum, r) => sum + r.estimated_cost_usd, 0).toFixed(2);

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-turns').textContent = totalTurns;
            document.getElementById('stat-avg-score').textContent = avgScore;
            document.getElementById('stat-cost').textContent = '$' + totalCost;
        }

        // 填充筛选器
        function populateFilters() {
            const approaches = [...new Set(allRecords.map(r => r.approach))];
            const visitors = [...new Set(allRecords.map(r => r.visitor_name || '虚拟人设'))];

            const approachSelect = document.getElementById('filter-approach');
            approaches.forEach(app => {
                const option = document.createElement('option');
                option.value = app;
                option.textContent = app;
                approachSelect.appendChild(option);
            });

            const visitorSelect = document.getElementById('filter-visitor');
            visitors.forEach(vis => {
                const option = document.createElement('option');
                option.value = vis;
                option.textContent = vis;
                visitorSelect.appendChild(option);
            });

            // 监听筛选变化
            approachSelect.onchange = applyFilters;
            visitorSelect.onchange = applyFilters;
            document.getElementById('filter-date').onchange = applyFilters;
        }

        // 应用筛选
        function applyFilters() {
            const approach = document.getElementById('filter-approach').value;
            const visitor = document.getElementById('filter-visitor').value;
            const date = document.getElementById('filter-date').value;

            filteredRecords = allRecords.filter(r => {
                if (approach && r.approach !== approach) return false;
                if (visitor && (r.visitor_name || '虚拟人设') !== visitor) return false;
                if (date && !r.created_at.startsWith(date)) return false;
                return true;
            });

            updateStatistics();
            renderTable();
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('filter-approach').value = '';
            document.getElementById('filter-visitor').value = '';
            document.getElementById('filter-date').value = '';
            filteredRecords = allRecords;
            updateStatistics();
            renderTable();
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('records-tbody');
            tbody.innerHTML = '';

            if (filteredRecords.length === 0) {
                showNoRecords();
                return;
            }

            document.getElementById('no-records').classList.add('hidden');
            tbody.parentElement.classList.remove('hidden');

            filteredRecords.forEach(record => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';

                // 格式化日期
                const date = new Date(record.created_at);
                const dateStr = date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 格式化时长
                const duration = Math.floor(record.duration_seconds / 60) + '分' + (record.duration_seconds % 60) + '秒';

                // 来访者名称
                const visitorName = record.visitor_name || '虚拟人设';

                // 分数颜色
                const scoreColor = record.overall_score >= 7 ? 'text-green-600' :
                                  record.overall_score >= 5 ? 'text-yellow-600' : 'text-red-600';

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${dateStr}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${visitorName}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-800">
                            ${record.approach}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${record.total_turns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${scoreColor}">${record.overall_score.toFixed(1)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${duration}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">$${record.estimated_cost_usd.toFixed(2)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                        <button onclick="viewRecord('${record.session_id}')" class="text-blue-600 hover:text-blue-800" title="查看详情">
                            <i class="fa fa-eye"></i>
                        </button>
                        <button onclick="playbackRecord('${record.session_id}')" class="text-green-600 hover:text-green-800" title="回放">
                            <i class="fa fa-play-circle"></i>
                        </button>
                        <button onclick="exportRecord('${record.session_id}')" class="text-purple-600 hover:text-purple-800" title="导出Excel">
                            <i class="fa fa-download"></i>
                        </button>
                        <button onclick="deleteRecord('${record.session_id}')" class="text-red-600 hover:text-red-800" title="删除">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        // 显示无记录
        function showNoRecords() {
            document.getElementById('no-records').classList.remove('hidden');
            document.getElementById('records-tbody').parentElement.classList.add('hidden');
        }

        // 查看详情（弹窗显示JSON）
        async function viewRecord(sessionId) {
            try {
                const response = await fetch(`http://localhost:8772/api/session_detail/${sessionId}`);
                const data = await response.json();
                alert(JSON.stringify(data, null, 2));
            } catch (error) {
                console.error('加载详情失败:', error);
                alert('加载详情失败');
            }
        }

        // 回放训练（跳转到回放页面）
        function playbackRecord(sessionId) {
            window.location.href = `playback.html?session_id=${sessionId}`;
        }

        // 导出Excel
        async function exportRecord(sessionId) {
            try {
                window.open(`http://localhost:8772/api/export_excel/${sessionId}`, '_blank');
            } catch (error) {
                console.error('导出失败:', error);
                alert('导出失败');
            }
        }

        // 删除记录
        async function deleteRecord(sessionId) {
            if (!confirm('确定要删除这条训练记录吗？此操作不可恢复。')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:8772/api/delete_session/${sessionId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('删除成功');
                    loadRecords(); // 重新加载
                } else {
                    alert('删除失败');
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败');
            }
        }
    </script>
</body>
</html>
