<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SW 清理</title></head>
<body style="font:18px system-ui,sans-serif;max-width:500px;margin:60px auto;text-align:center;padding:20px">
  <h2>🔄 更新应用缓存</h2>
  <p id="status" style="line-height:1.8;white-space:pre-wrap">正在清理旧缓存…</p>
  <script>
    (async function() {
      var el = document.getElementById('status');
      if (!('serviceWorker' in navigator)) {
        el.textContent = '浏览器不支持 SW，无需清理。';
        return;
      }
      var regs = await navigator.serviceWorker.getRegistrations();
      var swCount = regs.length;
      for (var r of regs) { await r.unregister(); }

      var cacheCount = 0;
      if ('caches' in window) {
        var keys = await caches.keys();
        cacheCount = keys.length;
        for (var k of keys) { await caches.delete(k); }
      }

      el.textContent = '✅ 清理完成！\n\n注销 SW：' + swCount + ' 个\n清除缓存：' + cacheCount + ' 个\n\n正在跳转到最新版本…';
      setTimeout(function() {
        // 跳回主页，强制从网络拉最新
        window.location.replace('/');
      }, 1500);
    })();
  </script>
</body>
</html>
