<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清理 Service Worker</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .status {
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #c82333;
        }
        button.primary {
            background: #007bff;
        }
        button.primary:hover {
            background: #0056b3;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🧹 Service Worker 清理工具</h1>
        <div id="status" class="status info">正在检测...</div>
        <div id="details"></div>
        <div>
            <button onclick="unregisterAll()">注销所有 Service Worker</button>
            <button onclick="clearAllCaches()">清除所有缓存</button>
            <button onclick="doAll()" class="primary">全部清理</button>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');

        async function checkStatus() {
            const registrations = await navigator.serviceWorker.getRegistrations();
            const cacheNames = await caches.keys();

            let html = '<h3>当前状态</h3>';
            html += `<p>Service Worker 注册数: <strong>${registrations.length}</strong></p>`;

            if (registrations.length > 0) {
                html += '<pre>';
                registrations.forEach((reg, i) => {
                    html += `[${i}] ${reg.scope}\n`;
                    if (reg.active) html += `    active: ${reg.active.scriptURL}\n`;
                    if (reg.waiting) html += `    waiting: ${reg.waiting.scriptURL}\n`;
                    if (reg.installing) html += `    installing: ${reg.installing.scriptURL}\n`;
                });
                html += '</pre>';
            }

            html += `<p>缓存数量: <strong>${cacheNames.length}</strong></p>`;
            if (cacheNames.length > 0) {
                html += '<pre>' + cacheNames.join('\n') + '</pre>';
            }

            detailsDiv.innerHTML = html;

            if (registrations.length === 0 && cacheNames.length === 0) {
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 已清理干净！可以关闭此页面，返回主应用刷新。';
            } else {
                statusDiv.className = 'status info';
                statusDiv.textContent = '检测到残留的 Service Worker 或缓存，点击按钮清理。';
            }
        }

        async function unregisterAll() {
            statusDiv.className = 'status info';
            statusDiv.textContent = '正在注销 Service Worker...';

            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
                await reg.unregister();
            }

            statusDiv.className = 'status success';
            statusDiv.textContent = `✅ 已注销 ${registrations.length} 个 Service Worker`;
            setTimeout(checkStatus, 500);
        }

        async function clearAllCaches() {
            statusDiv.className = 'status info';
            statusDiv.textContent = '正在清除缓存...';

            const cacheNames = await caches.keys();
            for (const name of cacheNames) {
                await caches.delete(name);
            }

            statusDiv.className = 'status success';
            statusDiv.textContent = `✅ 已清除 ${cacheNames.length} 个缓存`;
            setTimeout(checkStatus, 500);
        }

        async function doAll() {
            await unregisterAll();
            await clearAllCaches();

            statusDiv.className = 'status success';
            statusDiv.textContent = '✅ 全部清理完成！请关闭此页面，返回主应用刷新。';
        }

        // 初始检测
        checkStatus();
    </script>
</body>
</html>
